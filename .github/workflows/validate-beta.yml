name: Validate localized Android beta pages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/generate-beta.mjs --check
      - run: node --test tests/beta-portal.test.mjs tests/beta-interaction.test.mjs
